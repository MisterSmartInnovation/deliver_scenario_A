
<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeLIVER | Scenario</title>
    <style>
      :root {
        --blue: #0068d9;
        --ink: #11243d;
        --muted: #617089;
        --line: #d7e1ec;
        --surface: #f7faff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background: var(--surface);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .screen {
        position: relative;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: clamp(22px, 5vh, 42px) clamp(28px, 6vw, 92px)
          clamp(24px, 5vh, 44px);
        isolation: isolate;
      }

      .screen::before {
        position: absolute;
        z-index: -1;
        top: -34vh;
        right: -9vw;
        width: 46vw;
        height: 70vh;
        border-radius: 50%;
        background: #edf5ff;
        content: "";
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .logo-mister {
        width: clamp(102px, 14vw, 166px);
        height: auto;
      }

      .logo-deliver {
        width: clamp(136px, 18vw, 216px);
        height: auto;
        margin-top: 3px;
      }

      .content {
        display: flex;
        width: min(100%, 640px);
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        margin: -2vh auto 0;
      }

      .scenario {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: clamp(18px, 3vh, 30px);
        color: var(--blue);
        font-size: clamp(11px, 1.25vw, 14px);
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .dots {
        display: flex;
        gap: 7px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border: 1px solid var(--blue);
        border-radius: 50%;
      }

      .dot.active {
        background: var(--blue);
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(34px, 5vw, 64px);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1.03;
      }

      .subtitle {
        max-width: 510px;
        margin: clamp(14px, 2.3vh, 22px) 0 0;
        color: var(--muted);
        font-size: clamp(16px, 1.65vw, 21px);
        line-height: 1.45;
      }

      .next {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 142px;
        min-height: 48px;
        margin-top: clamp(26px, 4vh, 40px);
        border: 0;
        border-radius: 5px;
        background: var(--blue);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }

      .language {
        position: absolute;
        right: clamp(28px, 6vw, 92px);
        bottom: clamp(24px, 5vh, 44px);
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 560px) {
        body {
          overflow: auto;
        }

        .screen {
          min-height: 100svh;
          padding-right: 24px;
          padding-left: 24px;
        }

        .content {
          margin-top: 2vh;
        }

        .language {
          right: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <header class="topbar">
        <img class="logo-mister" src="assets/Logo Mister_C.png" alt="Mister" />
        <img class="logo-deliver" src="assets/deliver-logo.png" alt="DeLIVER" />
      </header>

      <section class="content" aria-labelledby="scenario-title">
        <div class="scenario">
          <span>SCENARIO 1/4</span>
          <span class="dots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </div>
        <h1 id="scenario-title">Scopri il tuo scenario</h1>
        <p class="subtitle">
          Inizia il percorso e scopri le opportunità più adatte a te.
        </p>
        <button class="next" type="button">AVANTI</button>
      </section>

      <div class="language" aria-label="Lingua: italiano">IT</div>
    </main>
  </body>
</html>
