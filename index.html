<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F0F4F7" />
    <title>DeLIVER</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap"
    />
    <style>
      :root {
        --background: #f0f4f7;
        --blue: #0e2d54;
        --muted: #9fabbb;
        --scenario: #be554b;
        --button: #086bb1;
        --button-text: #cee1ef;
        --edge-gap: max(1rem, env(safe-area-inset-left));
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--background);
        color: var(--blue);
      }

      body {
        min-height: 100dvh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
      }

      .screen {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        overflow: hidden;
        padding: clamp(1rem, 4vw, 2.5rem);
      }

      .brand {
        position: absolute;
        z-index: 1;
        top: max(1rem, env(safe-area-inset-top));
        display: block;
        height: auto;
      }

      .brand--blue {
        left: var(--edge-gap);
        width: clamp(1.25rem, 5vw, 2.5rem);
      }

      .brand--deliver {
        right: var(--edge-gap);
        width: clamp(4rem, 14vw, 7rem);
      }

      .translation {
        position: absolute;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
        display: grid;
        width: clamp(2rem, 5vw, 2.75rem);
        height: clamp(2rem, 5vw, 2.75rem);
        place-items: center;
        color: var(--blue);
        text-decoration: none;
      }

      .translation .material-symbols-outlined {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-variation-settings: "wght" 400, "FILL" 0, "GRAD" 0, "opsz" 48;
      }

      .scenario {
        position: absolute;
        top: 50%;
        left: var(--edge-gap);
        width: min(62vw, 50rem);
        transform: translateY(-50%);
      }

      .scenario__header {
        display: flex;
        align-items: center;
        gap: clamp(2rem, 7vw, 6rem);
        margin-bottom: clamp(1.5rem, 4vh, 3rem);
      }

      .scenario__label {
        margin: 0;
        color: var(--scenario);
        font: 700 clamp(0.8rem, 1.6vw, 1.35rem) / 1.2 "Open Sans", sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .progress {
        position: relative;
        display: flex;
        align-items: center;
        width: min(25vw, 20rem);
      }

      .progress::before {
        position: absolute;
        width: inherit;
        height: 0.2rem;
        background: var(--muted);
        content: "";
        opacity: 0.45;
      }

      .progress__step {
        position: relative;
        width: clamp(0.9rem, 2vw, 1.5rem);
        height: clamp(0.9rem, 2vw, 1.5rem);
        margin-right: auto;
        border-radius: 50%;
        background: #c7d3df;
      }

      .progress__step:last-child {
        margin-right: 0;
      }

      .progress__step--active {
        background: var(--blue);
      }

      .scenario__title {
        max-width: 48rem;
        margin: 0;
        color: var(--blue);
        font: 700 clamp(2rem, 5.4vw, 4.5rem) / 1.08 "Manrope", sans-serif;
        letter-spacing: -0.045em;
      }

      .scenario__description {
        max-width: 35rem;
        margin: clamp(1rem, 2.5vh, 1.75rem) 0 0;
        color: var(--muted);
        font: 600 clamp(1rem, 2.2vw, 1.6rem) / 1.45 "Open Sans", sans-serif;
      }

      .scenario__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-width: clamp(12rem, 29vw, 23rem);
        min-height: clamp(3.25rem, 10vh, 5.5rem);
        margin-top: clamp(1.5rem, 5vh, 3.5rem);
        padding: 0 2rem;
        border: 0;
        border-radius: 1.25rem;
        background: var(--button);
        color: var(--button-text);
        font: 700 clamp(1rem, 2vw, 1.5rem) / 1 "Open Sans", sans-serif;
        letter-spacing: 0.02em;
        cursor: pointer;
        touch-action: manipulation;
      }

      .scenario__button .material-symbols-outlined {
        font-size: clamp(1.5rem, 3vw, 2.25rem);
      }

      .orientation-warning {
        display: none;
      }

      @media (orientation: portrait) {
        .screen {
          display: none;
        }

        .orientation-warning {
          display: grid;
          min-height: 100dvh;
          place-items: center;
        }

        .orientation-warning p {
          margin: 0;
        }

        .orientation-warning .material-symbols-outlined {
          display: block;
          color: var(--blue);
          font-size: clamp(3rem, 18vw, 5rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Schermata DeLIVER">
      <img class="brand brand--blue" src="assets/blue-logo.png" alt="Logo" />
      <img class="brand brand--deliver" src="assets/deliver-logo.png" alt="DeLIVER" />

      <section class="scenario" aria-labelledby="scenario-title">
        <div class="scenario__header">
          <p class="scenario__label">SCENARIO 1/4</p>
          <div class="progress" aria-label="Scenario 1 di 4">
            <span class="progress__step progress__step--active"></span>
            <span class="progress__step"></span>
            <span class="progress__step"></span>
            <span class="progress__step"></span>
          </div>
        </div>
        <h1 class="scenario__title" id="scenario-title">
          Vediamo com’è<br />il traffico in questa zona
        </h1>
        <p class="scenario__description">
          Osserva la situazione di partenza<br />prima di prendere la tua decisione.
        </p>
        <button class="scenario__button" type="button">
          AVANTI
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </button>
      </section>

      <a class="translation" href="#" aria-label="Traduzione">
        <span class="material-symbols-outlined" aria-hidden="true">translate</span>
      </a>
    </main>

    <div class="orientation-warning" role="status">
      <p>
        <span class="material-symbols-outlined" aria-hidden="true">smartphone</span>
      </p>
    </div>
  </body>
</html>
