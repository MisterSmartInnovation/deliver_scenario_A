<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F4F7" />
    <title>DeLIVER</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
    <style>
      :root {
        --background: #f0f4f7;
        --blue: #0e2d54;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--background);
        color: var(--blue);
      }

      body {
        min-height: 100dvh;
        font-family: Arial, Helvetica, sans-serif;
      }

      .screen {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        overflow: hidden;
        padding: clamp(1rem, 4vw, 2.5rem);
      }

      .brand {
        position: absolute;
        z-index: 1;
        top: max(1rem, env(safe-area-inset-top));
        display: block;
        height: auto;
      }

      .brand--blue {
        left: max(1rem, env(safe-area-inset-left));
        width: clamp(3.5rem, 14vw, 7rem);
      }

      .brand--deliver {
        right: max(1rem, env(safe-area-inset-right));
        width: clamp(6rem, 22vw, 12rem);
      }

      .translation {
        position: absolute;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
        display: grid;
        width: clamp(2.5rem, 8vw, 4rem);
        height: clamp(2.5rem, 8vw, 4rem);
        place-items: center;
        color: var(--blue);
        text-decoration: none;
      }

      .translation .material-symbols-outlined {
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-variation-settings: "wght" 400, "FILL" 0, "GRAD" 0, "opsz" 48;
      }

      .orientation-warning {
        display: none;
      }

      @media (orientation: portrait) {
        .screen {
          display: none;
        }

        .orientation-warning {
          display: grid;
          min-height: 100dvh;
          padding: 2rem;
          place-items: center;
          text-align: center;
        }

        .orientation-warning p {
          max-width: 22rem;
          margin: 0;
          font-size: clamp(1rem, 5vw, 1.35rem);
          line-height: 1.4;
        }

        .orientation-warning .material-symbols-outlined {
          display: block;
          margin-bottom: 1rem;
          font-size: clamp(3rem, 16vw, 5rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Schermata DeLIVER">
      <img class="brand brand--blue" src="assets/blue-logo.png" alt="Logo" />
      <img class="brand brand--deliver" src="assets/deliver-logo.png" alt="DeLIVER" />

      <a class="translation" href="#" aria-label="Traduzione">
        <span class="material-symbols-outlined" aria-hidden="true">translate</span>
      </a>
    </main>

    <div class="orientation-warning" role="status">
      <p>
        <span class="material-symbols-outlined" aria-hidden="true">screen_rotation</span>
        Ruota lo smartphone in orizzontale per visualizzare la pagina.
      </p>
    </div>
  </body>
</html>
