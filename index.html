
<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeLIVER | Scenario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #086bb1;
        --ink: #0e2d54;
        --muted: #3e5776;
        --dot: #3989c1;
        --surface: #f7faff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        overflow: hidden;
        background: var(--surface);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .screen {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        flex-direction: column;
        padding: clamp(16px, 3vh, 28px) clamp(18px, 3vw, 44px)
          clamp(24px, 5vh, 44px);
        isolation: isolate;
      }

      .screen::before {
        position: absolute;
        z-index: -1;
        top: -34vh;
        right: -9vw;
        width: 46vw;
        height: 70vh;
        border-radius: 50%;
        background: #edf5ff;
        content: "";
      }

      .topbar {
        display: flex;
        width: 100%;
        min-width: 0;
        align-items: center;
        gap: clamp(16px, 4vw, 56px);
        justify-content: space-between;
      }

      .logo-mister {
        width: clamp(92px, 12vw, 150px);
        height: clamp(30px, 4vw, 42px);
        min-width: 0;
        object-fit: contain;
      }

      .logo-deliver {
        width: clamp(92px, 12vw, 150px);
        height: clamp(30px, 4vw, 42px);
        min-width: 0;
        object-fit: contain;
      }

      .content {
        display: flex;
        width: min(100%, 40rem);
        max-width: 100%;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        margin: -2vh auto 0;
      }

      .scenario {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: clamp(18px, 3vh, 30px);
        color: #ed6a5e;
        font-family: "Open Sans", Arial, Helvetica, sans-serif;
        font-size: clamp(11px, 1.25vw, 14px);
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .dots {
        display: flex;
        gap: 7px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border: 1px solid var(--dot);
        border-radius: 50%;
      }

      .dot.active {
        border-color: var(--blue);
        background: var(--blue);
      }

      h1 {
        max-width: 100%;
        margin: 0;
        color: var(--ink);
        font-family: Manrope, Arial, Helvetica, sans-serif;
        font-size: clamp(34px, 5vw, 64px);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1.03;
      }

      .subtitle {
        width: 100%;
        max-width: 32rem;
        margin: clamp(14px, 2.3vh, 22px) 0 0;
        color: var(--muted);
        font-family: "Open Sans", Arial, Helvetica, sans-serif;
        font-size: clamp(16px, 1.65vw, 21px);
        line-height: 1.45;
      }

      .next {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 142px;
        min-height: 48px;
        margin-top: clamp(26px, 4vh, 40px);
        border: 0;
        border-radius: 5px;
        background: var(--blue);
        color: #cee1ef;
        font-family: "Open Sans", Arial, Helvetica, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }

      @media (max-width: 560px) {
        body {
          overflow: auto;
        }

        .screen {
          min-height: 100svh;
          padding: clamp(16px, 4vw, 24px);
        }

        .content {
          margin-top: 2vh;
        }

        .scenario {
          flex-wrap: wrap;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <header class="topbar">
        <img class="logo-mister" src="assets/Logo Mister_C.png" alt="Mister" />
        <img class="logo-deliver" src="assets/deliver-logo.png" alt="DeLIVER" />
      </header>

      <section class="content" aria-labelledby="scenario-title">
        <div class="scenario">
          <span>SCENARIO 1/4</span>
          <span class="dots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </div>
        <h1 id="scenario-title">Vediamo com'è il traffico in questa zona</h1>
        <p class="subtitle">
          Osserva la situazione di partenza prima di prendere la tua decisione
        </p>
        <button class="next" type="button">AVANTI</button>
      </section>
    </main>
  </body>
</html>
